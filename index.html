<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แปลงรูปเป็น Excel</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a727c;--bd:#e1e5ea;--pri:#2563eb;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2126;--tx:#eceff2;--mut:#9aa3ad;--bd:#2c323a;--pri:#5b8def;--ok:#4ade80;--okbg:#14351f;--bad:#f87171;--badbg:#3b1717;--warn:#facc15;--warnbg:#3a3210;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2126;--tx:#eceff2;--mut:#9aa3ad;--bd:#2c323a;--pri:#5b8def;--ok:#4ade80;--okbg:#14351f;--bad:#f87171;--badbg:#3b1717;--warn:#facc15;--warnbg:#3a3210;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.pick{display:block;text-align:center;border:2px dashed var(--bd);border-radius:14px;padding:28px 12px;cursor:pointer;color:var(--mut)}
.pick b{display:block;color:var(--tx);font-size:17px}
input[type=file]{display:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;vertical-align:middle}
th{color:var(--mut);font-weight:600}
td img{width:52px;height:52px;object-fit:cover;border-radius:8px;display:block}
td input{width:84px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.wait{background:var(--warnbg);color:var(--warn)}
.msg{font-size:14px;color:var(--mut);margin-top:10px;min-height:20px}
.sum{display:flex;gap:14px;font-size:14px;margin-bottom:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <h1>แปลงรูปเป็น Excel</h1>
  <p class="sub">เช็กน้ำหนักห่อ (รวมห่อ − ชั่ง) ปกติ <b>5.0–5.6</b> · สูงสุด 10 รูปต่อรอบ</p>

  <div class="card">
    <label class="pick" for="f"><b>แตะเพื่อเลือกรูป</b>สูงสุด 10 รูปต่อรอบ</label>
    <input id="f" type="file" accept="image/*" multiple>
    <div class="btns">
      <button id="go">กรอกตัวเลขลงตาราง</button>
      <button id="xl" class="sec" disabled>ดาวน์โหลด Excel</button>
      <button id="clr" class="sec" disabled>ล้าง</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="res" hidden>
    <div class="sum" id="sum"></div>
    <div class="wrap"><table>
      <thead><tr><th>#</th><th>รูป</th><th>รวมห่อ</th><th>ชั่ง</th><th>ผลต่าง</th><th>สถานะ</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="sub" style="margin:10px 0 0">พิมพ์หรือแก้ตัวเลขในช่องได้ตามต้องการ ระบบจะคำนวณผลต่างและสถานะให้อัตโนมัติ</p>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const MIN=5.0, MAX=5.6, LIMIT=10;
let items=[]; 
const $=id=>document.getElementById(id);
const msg=t=>$('msg').textContent=t||'';

function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const s=Math.min(1,1400/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('resize')),'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('load'))};
    img.src=u;
  });
}

$('f').addEventListener('change',async e=>{
  let files=[...e.target.files];
  if(!files.length)return;
  if(files.length>LIMIT){files=files.slice(0,LIMIT);msg('เลือกเกิน '+LIMIT+' รูป ใช้เฉพาะ '+LIMIT+' รูปแรก');}
  else msg('');
  items.forEach(i=>URL.revokeObjectURL(i.url));
  items=[];
  for(const f of files){
    try{const b=await shrink(f);items.push({name:f.name,blob:b,url:URL.createObjectURL(b),gross:'',net:'',state:'done'});}
    catch(_){}
  }
  e.target.value='';
  render();
});

const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
function diff(i){const g=num(i.gross),n=num(i.net);return(g===null||n===null)?null:Math.round((g-n)*1000)/1000}
function status(i){
  const d=diff(i);
  if(d===null)return['รอใส่ข้อมูล','wait'];
  return(d>=MIN&&d<=MAX)?['ปกติ','ok']:['ผิดปกติ','bad'];
}
function render(){
  $('res').hidden=!items.length;
  $('clr').disabled=!items.length;
  $('xl').disabled=!items.some(i=>i.gross!=='' || i.net!=='');
  const tb=$('rows');tb.innerHTML='';
  items.forEach((it,k)=>{
    const [t,c]=status(it);
    const tr=document.createElement('tr');
    const d=diff(it);
    tr.innerHTML='<td>'+(k+1)+'</td><td><img alt=""></td>'+
      '<td><input inputmode="decimal" data-k="'+k+'" data-f="gross" placeholder="รวมห่อ"></td>'+
      '<td><input inputmode="decimal" data-k="'+k+'" data-f="net" placeholder="ชั่ง"></td>'+
      '<td class="d">'+(d===null?'–':d.toFixed(2))+'</td>'+
      '<td><span class="chip '+c+'">'+t+'</span></td>';
    tr.querySelector('img').src=it.url;
    const ins=tr.querySelectorAll('input');
    ins[0].value=it.gross;ins[1].value=it.net;
    ins.forEach(inp=>inp.addEventListener('input',()=>{
      const x=items[inp.dataset.k];x[inp.dataset.f]=inp.value;
      const [t2,c2]=status(x),dd=diff(x);
      tr.querySelector('.d').textContent=dd===null?'–':dd.toFixed(2);
      const ch=tr.querySelector('.chip');ch.textContent=t2;ch.className='chip '+c2;
      $('xl').disabled=false;sum();
    }));
    tb.appendChild(tr);
  });
  sum();
}
function sum(){
  let ok=0,bad=0;
  items.forEach(i=>{const[,c]=status(i);if(c==='ok')ok++;else if(c==='bad')bad++;});
  $('sum').innerHTML='<span>ทั้งหมด '+items.length+' รูป</span><span class="chip ok">ปกติ '+ok+'</span><span class="chip bad">ผิดปกติ/รอข้อมูล '+bad+'</span>';
}

$('go').addEventListener('click',()=>{
  if(!items.length){msg('กรุณาเลือกรูปภาพก่อนครับ');return;}
  msg('กรอกตัวเลขน้ำหนักรวมห่อและน้ำหนักชั่งลงในตารางได้เลยครับ');
});

$('xl').addEventListener('click',()=>{
  const rows=[['#','ไฟล์','รวมห่อ','ชั่ง','ผลต่าง (รวมห่อ−ชั่ง)','สถานะ (ปกติ '+MIN.toFixed(1)+'–'+MAX.toFixed(1)+')']];
  items.forEach((it,k)=>{
    const d=diff(it),[t]=status(it);
    rows.push([k+1,it.name,num(it.gross),num(it.net),d,t]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:5},{wch:28},{wch:10},{wch:10},{wch:22},{wch:26}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'น้ำหนักห่อ');
  XLSX.writeFile(wb,'น้ำหนักห่อ.xlsx');
  msg('ดาวน์โหลดไฟล์ Excel เรียบร้อยแล้วครับ');
});

$('clr').addEventListener('click',()=>{
  items.forEach(i=>URL.revokeObjectURL(i.url));items=[];msg('');render();
});
</script>
</body>
</html>
